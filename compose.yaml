services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: company_service
      POSTGRES_USER: company
      POSTGRES_PASSWORD: company
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company -d company_service"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  migration:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path
      - /migrations
      - -database
      - postgres://company:company@postgres:5432/company_service?sslmode=disable
      - up

  company-service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://company:company@postgres:5432/company_service?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-xm-company-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-xm-company-service}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    stop_grace_period: 30s

volumes:
  postgres-data:
