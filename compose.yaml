services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: company_service
      POSTGRES_USER: company
      POSTGRES_PASSWORD: company
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company -d company_service"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  postgres-data:
